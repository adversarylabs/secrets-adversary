name: security/secrets
version: 0.0.14
description: Scans repository text for committed credentials and narrow credential exposure paths.

triggers:
  manual: true
  files_changed:
    - "**/*"

detection:
  files:
    - "**/*"

runtime:
  name: node
  version: "22"
  command:
    - dist/index.js

permissions:
  enforcement: advisory
  filesystem:
    read:
      - .
    write:
      - .adversary/results
  network: false
  model: true
  environment:
    allow: []

findings:
  format: adversary.review.v1
